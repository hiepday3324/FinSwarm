run:
  run_id: finswarm_e4_demo_fit
  seed: 42

inputs:
  experiment_config: config/swarm/experiment_v1.yaml
  artifact_dir: data/training/finswarm_v1
  split_manifest: data/manifests/price_split_manifest.json

output:
  model_dir: data/model_artifacts/finswarm_e4_demo_fit

text_embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  dimension: 384
  pooling: mean
  normalize: true
  max_length: 512
  batch_size: 32
  text_view_version: full-causal-agent-context-v1
  local_files_only: true

split:
  embargo_trading_days: 20
  validation_selection_fraction: 0.6666667
  oof_folds: 5
  oof_min_train_days: 60

labels:
  positive_label: 1
  negative_label: -1
  neutral_label: 0
  mask_neutral: true
  threshold_bps: 10

graph:
  topology: full
  include_text_score: true

fusion:
  head: scalar_logit_stack

oof:
  training_policy: fixed_epochs

text_model:
  baseline: logistic_regression
  primary: mlp
  hidden_dim: 128
  dropout: 0.0
  learning_rate: 0.001
  weight_decay: 0.0
  batch_size: 64
  max_epochs: 300
  patience: 300

graph_model:
  hidden_dim: 32
  num_heads: 4
  dropout: 0.0
  learning_rate: 0.001
  weight_decay: 0.0
  batch_size: 32
  max_epochs: 500
  patience: 500
  gradient_clip_norm: 1.0

fusion_model:
  latent_dim: 32
  dropout: 0.0
  learning_rate: 0.001
  weight_decay: 0.0
  batch_size: 64
  max_epochs: 1000
  patience: 1000

calibration:
  method: temperature

demo_fit:
  demo_only: true
  intentionally_in_sample: true
  evaluation_mode: train_replay
  model_frozen_during_ui: true
  train_start: 2024-09-06
  train_end: 2025-08-11
  checkpoint_selection: minimum_train_loss
  early_stopping: disabled
  stop_roc_auc: 0.90
  stop_balanced_accuracy: 0.85
  expected_supervised_rows: 651
  validation_access_count: 0
  test_access_count: 0
