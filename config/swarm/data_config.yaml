paths:
  raw: data/raw
  parquet: data/parquet
  duckdb: data/duckdb
  sqlite: data/sqlite
  faiss: data/faiss
  event_store: data/event_store
  checkpoints: data/checkpoints
  model_artifacts: data/model_artifacts
  reports: data/reports

price_data:
  provider: massive
  api_key_env: MASSIVE_API_KEY

  symbols:
    - TSLA
    - NVDA
    - AAPL

  requested_start: "2024-07-01"
  requested_end: "2026-07-10"

  multiplier: 1
  timespan: day
  adjusted: true
  sort: asc
  limit: 50000

  market_timezone: America/New_York
  forward_fill: false
